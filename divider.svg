<svg xmlns="http://www.w3.org/2000/svg" width="900" height="12" viewBox="0 0 900 12" role="img" aria-label="divider">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#2E8B57"><animate attributeName="stop-color" values="#2E8B57;#3178C6;#F37626;#2E8B57" dur="6s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#3178C6"><animate attributeName="stop-color" values="#3178C6;#F37626;#2E8B57;#3178C6" dur="6s" repeatCount="indefinite"/></stop>
    </linearGradient>
  </defs>
  <rect x="0" y="4" width="900" height="3" rx="1.5" fill="url(#g)" opacity="0.8"/>
  <circle cy="5.5" r="4" fill="#fff" opacity="0.9"><animate attributeName="cx" values="0;900" dur="3.5s" repeatCount="indefinite"/></circle>
</svg>
