<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" role="img" aria-label="Hi, I'm Dharanish. AI and Data Science Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2027"/>
      <stop offset="0.5" stop-color="#203a43"/>
      <stop offset="1" stop-color="#2c5364"/>
    </linearGradient>
    <clipPath id="clip"><rect width="900" height="200" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="900" height="200" fill="url(#bg)"/>
    <path d="M0 150 Q 150 110 300 150 T 600 150 T 900 150 V200 H0 Z" fill="#2E8B57" fill-opacity="0.35">
      <animateTransform attributeName="transform" type="translate" values="0 0; -300 0" dur="8s" repeatCount="indefinite"/>
    </path>
    <path d="M300 165 Q 450 125 600 165 T 900 165 T 1200 165 V200 H300 Z" fill="#3178C6" fill-opacity="0.35">
      <animateTransform attributeName="transform" type="translate" values="0 0; -300 0" dur="5s" repeatCount="indefinite"/>
    </path>
    <circle cx="80" cy="40" r="3" fill="#fff" fill-opacity="0.6"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="60" r="2.5" fill="#fff" fill-opacity="0.6"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="30" r="2" fill="#fff" fill-opacity="0.6"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.4s" repeatCount="indefinite"/></circle>
    <text x="450" y="95" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="48" font-weight="800" fill="#ffffff">Hi, I'm Dharanish
      <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
    </text>
    <text x="450" y="132" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#cfe9dc">AI &amp; Data Science Engineer
      <animate attributeName="opacity" values="0;1" dur="1.8s" fill="freeze"/>
    </text>
  </g>
</svg>
